<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6fa" />
    <meta name="description" content="מרכז הלמידה האישי לבגרות במתמטיקה 5 יחידות — שאלונים 35581 ו-35582 לפי המיקוד לקיץ 2026" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <title>חמש יחידות — מרכז הלמידה שלי</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('bagrut:v1') || '{}');
        var t = s.theme === 'dark' || s.theme === 'light' ? s.theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>

    <noscript>האפליקציה דורשת JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
